packages:
  - packages/*
  - tests/agent-daemon/fixtures/*
  - tests

engineStrict: true
minimumReleaseAge: 1440

# Keep the architecture parser's compiler API independent of the TS7 compiler.
packageExtensions:
  dependency-cruiser@18.2.0:
    dependencies:
      typescript: 6.0.3

overrides:
  happy-dom: 20.14.3

allowBuilds:
  '@clerk/shared': true
  esbuild: true
  simple-git-hooks: true
  workerd: true
