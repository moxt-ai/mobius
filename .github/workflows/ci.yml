name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The main-branch merge queue requests checks through this event.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker-config:
    name: Validate Worker config (${{ matrix.environment }})
    if: >-
      github.repository == 'moxt-ai/mobius' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Validate GitHub runtime configuration
        run: node scripts/validate-worker-config.ts
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          MOBIUS_PLATFORM_ALLOWED_ORIGINS: ${{ vars.MOBIUS_PLATFORM_ALLOWED_ORIGINS }}
          MOBIUS_PLATFORM_OIDC_PROVIDERS: ${{ vars.MOBIUS_PLATFORM_OIDC_PROVIDERS }}
          MOBIUS_PLATFORM_OPERATOR_SUBJECTS: ${{ vars.MOBIUS_PLATFORM_OPERATOR_SUBJECTS }}
          SESSION_ACTIVE_SESSIONS_PER_PROJECT: ${{ vars.SESSION_ACTIVE_SESSIONS_PER_PROJECT }}
          SESSION_ARCHIVE_BYTES_PER_SESSION: ${{ vars.SESSION_ARCHIVE_BYTES_PER_SESSION }}

  static:
    name: static
    # Post-merge pushes to main skip test/lint/typecheck; the merge queue already verified them.
    if: github.event_name != 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: static-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm check:static

  tests:
    name: test:${{ matrix.group }}
    # Three groups retain useful parallelism without rebuilding the workspace for every suite.
    if: github.event_name != 'push'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: test-${{ matrix.group }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        group: [client, relay, hosting]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run ${{ matrix.group }} suites
        run: pnpm "test:coverage:$TEST_GROUP"
        env:
          TEST_GROUP: ${{ matrix.group }}

      - name: Save coverage maps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.group }}
          path: coverage/*/coverage-final.json
          if-no-files-found: error
          retention-days: 14

  agent-daemon-plan:
    name: Plan Agent and daemon tests
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Test planner
        run: node --test scripts/plan-agent-daemon-tests.test.mjs

      - name: Select affected Agents
        id: plan
        run: node scripts/plan-agent-daemon-tests.mjs --base "$BASE_SHA" --head "$GITHUB_SHA" --github-output "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}

  agent-daemon:
    name: test:agent-daemon:${{ matrix.agent }}
    # Post-merge pushes to main skip tests; the merge queue already verified them.
    if: github.event_name != 'push' && needs.agent-daemon-plan.outputs.count != '0'
    needs: agent-daemon-plan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: agent-daemon-${{ matrix.agent }}-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.agent-daemon-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build test assets
        run: pnpm build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.agent == 'hermes'
        with:
          python-version: "3.12"

      - name: Install npm Agent
        if: matrix.packages != ''
        run: npm install --global $AGENT_PACKAGES
        env:
          AGENT_PACKAGES: ${{ matrix.packages }}

      - name: Install Hermes
        if: matrix.agent == 'hermes'
        run: |
          git clone --depth 1 --branch v2026.9.7 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          python -m pip install --editable '/tmp/hermes-agent[acp]'

      - name: Install Cursor Agent Local
        if: matrix.agent == 'cursor'
        run: |
          mkdir -p /tmp/cursor-agent-local
          curl -fsSL https://downloads.cursor.com/lab/2026.09.15-d2fe57e/linux/x64/agent-cli-local-package.tar.gz \
            | tar --strip-components=1 -xzf - -C /tmp/cursor-agent-local
          echo "MOBIUS_TEST_CURSOR_LOCAL_PATH=/tmp/cursor-agent-local/cursor-agent-local" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.agent }} Agent and daemon integration test
        run: pnpm exec vitest run --config vitest.agent-daemon.config.ts "$TEST_FILE"
        env:
          TEST_FILE: tests/agent-daemon/cases/${{ matrix.agent }}.integration.test.ts

  check:
    name: check
    needs: [static, tests, agent-daemon-plan, agent-daemon]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        run: |
          test "$STATIC_RESULT" = success || test "$STATIC_RESULT" = skipped
          test "$TESTS_RESULT" = success || test "$TESTS_RESULT" = skipped
          test "$AGENT_DAEMON_PLAN_RESULT" = success || test "$AGENT_DAEMON_PLAN_RESULT" = skipped
          test "$AGENT_DAEMON_RESULT" = success || test "$AGENT_DAEMON_RESULT" = skipped
        env:
          AGENT_DAEMON_RESULT: ${{ needs.agent-daemon.result }}
          AGENT_DAEMON_PLAN_RESULT: ${{ needs.agent-daemon-plan.result }}
          STATIC_RESULT: ${{ needs.static.result }}
          TESTS_RESULT: ${{ needs.tests.result }}

  deploy-cloudflare:
    name: deploy Cloudflare
    if: >-
      !cancelled() &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      github.repository == 'moxt-ai/mobius' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: mobius-relay-production
      url: https://mobius-relay.paraflow.biz
    concurrency:
      group: deploy-mobius-relay-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Deploy mobius-relay
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm wrangler deploy \
            --config wrangler.r2.jsonc \
            --domain mobius-relay.paraflow.biz \
            --strict \
            --message "GitHub ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

      - name: Verify production health
        shell: bash
        run: |
          expected='{"service":"mobius-relay","status":"ok"}'
          actual=''
          for attempt in {1..6}; do
            if actual="$(curl \
              --fail \
              --show-error \
              --silent \
              --connect-timeout 5 \
              --max-time 15 \
              https://mobius-relay.paraflow.biz/mobius/api/health)" && \
              [[ "$actual" == "$expected" ]]; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done
          echo "Unexpected health response after deployment propagation: $actual" >&2
          exit 1

  deploy-cloudflare-platform:
    name: deploy Platform (${{ matrix.environment }})
    if: >-
      !cancelled() &&
      needs.validate-worker-config.result == 'success' &&
      (needs.check.result == 'success' || needs.check.result == 'skipped') &&
      github.repository == 'moxt-ai/mobius' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [check, validate-worker-config]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            domain: mobius.moxt.ws
          - environment: production
            domain: mobius.moxt.ai
    environment:
      name: ${{ matrix.environment }}
      url: https://${{ matrix.domain }}
    concurrency:
      group: deploy-mobius-platform-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Deploy mobius-platform
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MOBIUS_PLATFORM_ALLOWED_ORIGINS: ${{ vars.MOBIUS_PLATFORM_ALLOWED_ORIGINS }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          MOBIUS_PLATFORM_OIDC_PROVIDERS: ${{ vars.MOBIUS_PLATFORM_OIDC_PROVIDERS }}
          MOBIUS_PLATFORM_OPERATOR_SUBJECTS: ${{ vars.MOBIUS_PLATFORM_OPERATOR_SUBJECTS }}
          SESSION_ACTIVE_SESSIONS_PER_PROJECT: ${{ vars.SESSION_ACTIVE_SESSIONS_PER_PROJECT }}
          SESSION_ARCHIVE_BYTES_PER_SESSION: ${{ vars.SESSION_ARCHIVE_BYTES_PER_SESSION }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}
        shell: bash
        run: |
          node scripts/validate-worker-config.ts
          umask 077
          secrets_file="$(mktemp "$RUNNER_TEMP/worker-secrets.XXXXXX.json")"
          trap 'rm -f "$secrets_file"' EXIT
          node scripts/validate-worker-config.ts secrets > "$secrets_file"
          worker_vars="$(node scripts/validate-worker-config.ts vars)"
          args=()
          while IFS= read -r -d '' binding; do
            args+=(--var "$binding")
          done < <(printf '%s' "$worker_vars" | jq -j 'to_entries[] | .key + ":" + .value + "\u0000"')
          pnpm wrangler deploy \
            --config packages/relay-cloudflare-platform/wrangler.jsonc \
            --env "$DEPLOY_ENVIRONMENT" \
            --secrets-file "$secrets_file" \
            "${args[@]}" \
            --message "GitHub ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

      - name: Verify Platform health
        shell: bash
        run: |
          expected='{"service":"mobius-relay-platform","status":"ok"}'
          actual=''
          for attempt in {1..6}; do
            if actual="$(curl \
              --fail \
              --show-error \
              --silent \
              --connect-timeout 5 \
              --max-time 15 \
              "https://${{ matrix.domain }}/mobius/api/dashboard/health")" && \
              [[ "$actual" == "$expected" ]]; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done
          echo "Unexpected Platform health response after deployment propagation: $actual" >&2
          exit 1

      - name: Verify Platform app HTML and JavaScript
        env:
          PLATFORM_ORIGIN: https://${{ matrix.domain }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from html.parser import HTMLParser
          from urllib.parse import urljoin, urlsplit

          def download(url):
              result = subprocess.run(
                  ["curl", "--fail", "--silent", "--show-error", "--connect-timeout", "5",
                   "--max-time", "15", "--write-out", "\n%{content_type}", url],
                  check=True, stdout=subprocess.PIPE, text=True, timeout=20,
              )
              body, content_type = result.stdout.rsplit("\n", 1)
              return body, content_type.split(";", 1)[0]

          class AppPage(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.has_root = False
                  self.modules = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get("id") == "root":
                      self.has_root = True
                  if tag == "script" and attrs.get("type") == "module" and attrs.get("src"):
                      self.modules.append(attrs["src"])

          origin = os.environ["PLATFORM_ORIGIN"]
          html, content_type = download(origin + "/")
          assert content_type == "text/html", "Platform root must serve HTML"
          page = AppPage()
          page.feed(html)
          assert page.has_root and page.modules, "Platform HTML must contain the app root and entry module"
          for source in page.modules:
              url = urljoin(origin + "/", source)
              assert urlsplit(url).scheme == "https" and urlsplit(url).netloc == urlsplit(origin).netloc, "Entry module must use the Platform origin"
              javascript, content_type = download(url)
              assert content_type in ("application/javascript", "text/javascript"), "Entry module must serve JavaScript"
              assert javascript, "Entry module must not be empty"
          print(f"Platform app HTML and entry modules are available at {origin}")
          PY
