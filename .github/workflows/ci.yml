name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect documentation-only changes
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: python
        run: |
          import os
          import subprocess
          from pathlib import PurePosixPath

          base = os.environ['BASE_SHA']
          docs_only = False
          if os.environ['EVENT_NAME'] != 'workflow_dispatch' and base and set(base) != {'0'}:
              # Disable rename detection so both old and new paths must qualify.
              paths = subprocess.check_output([
                  'git', 'diff', '--no-renames', '--name-only', '-z',
                  base, os.environ['HEAD_SHA'], '--',
              ]).decode('utf-8').split('\0')[:-1]
              def is_documentation(path):
                  suffix = PurePosixPath(path).suffix.lower()
                  return suffix in {'.md', '.markdown', '.mdx'} or (
                      path.startswith('docs/assets/') and
                      suffix in {'.svg', '.png', '.jpg', '.jpeg', '.gif', '.webp', '.avif'}
                  )
              docs_only = bool(paths) and all(is_documentation(path) for path in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'docs-only={str(docs_only).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Documentation only: skip runtime checks and deployment.\n' if docs_only
                            else 'Code, configuration, or manual run: run full validation.\n')

  validate-worker-config:
    name: Validate Worker config (${{ matrix.environment }})
    needs: changes
    if: >-
      needs.changes.outputs.docs-only == 'false' &&
      github.repository == 'moxt-ai/mobius' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate GitHub runtime configuration
        run: node scripts/validate-worker-config.ts
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          MOBIUS_SESSION_WEBHOOK_SECRET_ENCRYPTION_KEY: ${{ secrets.MOBIUS_SESSION_WEBHOOK_SECRET_ENCRYPTION_KEY }}
          MOBIUS_PLATFORM_ALLOWED_ORIGINS: ${{ vars.MOBIUS_PLATFORM_ALLOWED_ORIGINS }}
          MOBIUS_PLATFORM_OIDC_PROVIDERS: ${{ vars.MOBIUS_PLATFORM_OIDC_PROVIDERS }}
          MOBIUS_PLATFORM_OPERATOR_SUBJECTS: ${{ vars.MOBIUS_PLATFORM_OPERATOR_SUBJECTS }}
          SESSION_ACTIVE_SESSIONS_PER_PROJECT: ${{ vars.SESSION_ACTIVE_SESSIONS_PER_PROJECT }}

  checks:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Static checks
            command: pnpm lint && pnpm typecheck && pnpm --filter @moxt-ai/mobius build
          - name: Hosting tests
            command: pnpm test:ci:hosting
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}

  client-tests:
    name: Client tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TEST_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # setup-node caches package contents, but not pnpm's registry metadata and policy-verification receipts.
      # pnpm still validates the lockfile hash and active policy before trusting a cached receipt.
      - name: Cache pnpm verification metadata
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pnpm-metadata
          key: pnpm-metadata-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', '.nvmrc', '.npmrc', '.pnpmfile.cjs', 'pnpmfile.cjs') }}
      - run: pnpm install --frozen-lockfile --cache-dir="$RUNNER_TEMP/pnpm-metadata"
      # Bound concurrent process/Worker startup on the hosted runner's two vCPUs.
      - name: Run controlled daemon scenarios
        run: pnpm test:ci:client:daemon --shard="$TEST_SHARD" --maxWorkers=2
      - name: Run SDK and client scenarios
        if: ${{ !cancelled() }}
        run: pnpm test:ci:client:sdk --shard="$TEST_SHARD" --maxWorkers=2

  client-check:
    # Keep the existing required check name; success requires every shard, not just the SDK phase.
    name: Client tests
    needs: [changes, client-tests]
    if: always() && needs.changes.outputs.docs-only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every client shard to succeed
        env:
          CLIENT_TESTS_RESULT: ${{ needs.client-tests.result }}
        run: test "$CLIENT_TESTS_RESULT" = success

  real-agents:
    name: Real Agent compatibility (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install real Agents
        run: >-
          npm install --global
          @openai/codex@0.154.0
          @anthropic-ai/claude-code@2.1.273
          @earendil-works/pi-coding-agent@1.1.0
          pi-acp@0.0.34
      - run: pnpm test:agent-daemon:real --shard="$TEST_SHARD"
        env:
          TEST_SHARD: ${{ matrix.shard }}/4

  package-versions:
    # Pull requests that raise a package to the same version merge without a conflict,
    # and the later one is then never published. A pull request that raises a version
    # must stay above the base it lands on, which the merge queue checks last.
    name: Package version bumps
    needs: changes
    if: needs.changes.outputs.docs-only == 'false' && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Require versions above the base for published package changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        run: node scripts/ci-check-package-version-bumps.cjs

  npm-compatibility:
    # The daemon finds and installs its own upgrades through the user's npm, so its
    # upgrade journeys run against every supported npm major, not only the bundled one.
    name: npm compatibility (npm ${{ matrix.npm }}${{ matrix.os == 'windows-latest' && ', Windows' || '' }}) ${{ matrix.attempt }}
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        npm: ["10", "11", "12"]
        include:
          - os: windows-latest
            npm: "12"
            attempt: 1
          - os: windows-latest
            npm: "12"
            attempt: 2
          - os: windows-latest
            npm: "12"
            attempt: 3
          - os: windows-latest
            npm: "12"
            attempt: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install npm ${{ matrix.npm }}
        if: runner.os != 'Windows'
        env:
          NPM_MAJOR: ${{ matrix.npm }}
        run: npm install --global "npm@$NPM_MAJOR" && npm --version
      - name: Install npm ${{ matrix.npm }} on Windows
        if: runner.os == 'Windows'
        env:
          NPM_MAJOR: ${{ matrix.npm }}
        run: npm install --global "npm@$env:NPM_MAJOR" && npm --version
      - run: pnpm test:npm-compatibility

  cli-compatibility:
    needs: changes
    if: needs.changes.outputs.docs-only == 'false'
    uses: ./.github/workflows/cli-compatibility.yml

  validate:
    if: always()
    needs: [changes, checks, client-check, real-agents, npm-compatibility, package-versions, cli-compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          CLIENT_TESTS_RESULT: ${{ needs.client-check.result }}
          REAL_AGENTS_RESULT: ${{ needs.real-agents.result }}
          NPM_COMPATIBILITY_RESULT: ${{ needs.npm-compatibility.result }}
          PACKAGE_VERSIONS_RESULT: ${{ needs.package-versions.result }}
          CLI_COMPATIBILITY_RESULT: ${{ needs.cli-compatibility.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$CHANGES_RESULT" == "success" ]]
          if [[ "$DOCS_ONLY" == "true" ]]; then
            [[ "$CLIENT_TESTS_RESULT" == "skipped" ]]
            [[ "$CLI_COMPATIBILITY_RESULT" == "skipped" ]]
            [[ "$CHECKS_RESULT" == "skipped" && "$REAL_AGENTS_RESULT" == "skipped" && "$NPM_COMPATIBILITY_RESULT" == "skipped" && "$PACKAGE_VERSIONS_RESULT" == "skipped" ]]
          else
            [[ "$CLIENT_TESTS_RESULT" == "success" ]]
            [[ "$CLI_COMPATIBILITY_RESULT" == "success" ]]
            [[ "$DOCS_ONLY" == "false" && "$CHECKS_RESULT" == "success" && "$REAL_AGENTS_RESULT" == "success" && "$NPM_COMPATIBILITY_RESULT" == "success" ]]
            # Pushes and manual runs have no pull request whose version bump to check.
            if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "merge_group" ]]; then
              [[ "$PACKAGE_VERSIONS_RESULT" == "success" ]]
            else
              [[ "$PACKAGE_VERSIONS_RESULT" == "skipped" ]]
            fi
          fi

  deploy-cloudflare-platform:
    name: Deploy Platform (${{ matrix.environment }})
    if: >-
      !cancelled() &&
      needs.changes.outputs.docs-only == 'false' &&
      needs.validate.result == 'success' &&
      needs.validate-worker-config.result == 'success' &&
      needs.deploy-cloudflare-recording.result == 'success' &&
      github.repository == 'moxt-ai/mobius' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [changes, validate, validate-worker-config, deploy-cloudflare-recording]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            domain: mobius.moxt.ws
            database: mobius-platform-staging-control-plane-wnam
            recording-provider: recording-staging
          - environment: production
            domain: mobius.moxt.ai
            database: mobius-platform-production-control-plane-wnam
            recording-provider: recording-production
    environment:
      name: ${{ matrix.environment }}
      url: https://${{ matrix.domain }}
    concurrency:
      group: deploy-mobius-platform-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply Platform D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}
          D1_DATABASE: ${{ matrix.database }}
        run: >-
          pnpm --dir packages/relay-cloudflare-platform exec wrangler d1 migrations apply
          "$D1_DATABASE"
          --remote
          --config wrangler.jsonc
          --env "$DEPLOY_ENVIRONMENT"
      - name: Deploy Mobius Platform
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          MOBIUS_SESSION_WEBHOOK_SECRET_ENCRYPTION_KEY: ${{ secrets.MOBIUS_SESSION_WEBHOOK_SECRET_ENCRYPTION_KEY }}
          MOBIUS_PLATFORM_ALLOWED_ORIGINS: ${{ vars.MOBIUS_PLATFORM_ALLOWED_ORIGINS }}
          MOBIUS_PLATFORM_OIDC_PROVIDERS: ${{ vars.MOBIUS_PLATFORM_OIDC_PROVIDERS }}
          MOBIUS_PLATFORM_OPERATOR_SUBJECTS: ${{ vars.MOBIUS_PLATFORM_OPERATOR_SUBJECTS }}
          SESSION_ACTIVE_SESSIONS_PER_PROJECT: ${{ vars.SESSION_ACTIVE_SESSIONS_PER_PROJECT }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}
          RECORDING_PROVIDER_ID: ${{ matrix.recording-provider }}
        shell: bash
        run: |
          node scripts/validate-worker-config.ts
          pnpm --filter @moxt-ai/mobius-platform-app build --mode "$DEPLOY_ENVIRONMENT"
          umask 077
          secrets_file="$(mktemp "$RUNNER_TEMP/worker-secrets.XXXXXX.json")"
          trap 'rm -f "$secrets_file"' EXIT
          node scripts/validate-worker-config.ts secrets > "$secrets_file"
          worker_vars="$(node scripts/validate-worker-config.ts vars)"
          args=()
          while IFS= read -r -d '' binding; do
            args+=(--var "$binding")
          done < <(printf '%s' "$worker_vars" | jq -j 'to_entries[] | .key + ":" + .value + "\u0000"')
          pnpm --dir packages/relay-cloudflare-platform exec wrangler deploy \
            --config wrangler.jsonc \
            --env "$DEPLOY_ENVIRONMENT" \
            --var RECORDING_PROVIDER_ID:"$RECORDING_PROVIDER_ID" \
            --secrets-file "$secrets_file" \
            "${args[@]}" \
            --message "GitHub ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
      - name: Verify Platform health
        env:
          PLATFORM_ORIGIN: https://${{ matrix.domain }}
        shell: bash
        run: |
          expected='{"service":"mobius-relay-platform","status":"ok"}'
          actual=''
          for attempt in {1..6}; do
            if actual="$(curl \
              --fail \
              --show-error \
              --silent \
              --connect-timeout 5 \
              --max-time 15 \
              "$PLATFORM_ORIGIN/mobius/api/dashboard/health")" && \
              [[ "$actual" == "$expected" ]]; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done
          echo "Unexpected Platform health response after deployment propagation: $actual" >&2
          exit 1
      - name: Verify Platform page
        env:
          PLATFORM_ORIGIN: https://${{ matrix.domain }}
        shell: bash
        run: |
          for attempt in {1..6}; do
            if curl \
              --fail \
              --show-error \
              --silent \
              --connect-timeout 5 \
              --max-time 15 \
              "$PLATFORM_ORIGIN/" | grep -Fq '<title>Mobius Platform</title>'; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done
          echo "The Platform page was unavailable after deployment propagation" >&2
          exit 1

  deploy-cloudflare-recording:
    name: Deploy Recording (${{ matrix.environment }})
    if: >-
      !cancelled() &&
      needs.changes.outputs.docs-only == 'false' &&
      needs.validate.result == 'success' &&
      github.repository == 'moxt-ai/mobius' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [changes, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    concurrency:
      group: deploy-mobius-recording-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Deploy Mobius Recording
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}
        run: >-
          pnpm --dir packages/recording-cloudflare exec wrangler deploy
          --config wrangler.jsonc
          --env "$DEPLOY_ENVIRONMENT"
          --message "GitHub ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
