name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker-config:
    name: Validate Worker config (${{ matrix.environment }})
    if: >-
      github.repository == 'moxt-ai/mobius' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate GitHub runtime configuration
        run: node scripts/validate-worker-config.ts
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          MOBIUS_PLATFORM_ALLOWED_ORIGINS: ${{ vars.MOBIUS_PLATFORM_ALLOWED_ORIGINS }}
          MOBIUS_PLATFORM_OIDC_PROVIDERS: ${{ vars.MOBIUS_PLATFORM_OIDC_PROVIDERS }}
          MOBIUS_PLATFORM_OPERATOR_SUBJECTS: ${{ vars.MOBIUS_PLATFORM_OPERATOR_SUBJECTS }}
          SESSION_ACTIVE_SESSIONS_PER_PROJECT: ${{ vars.SESSION_ACTIVE_SESSIONS_PER_PROJECT }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: npm install --global @openai/codex@0.154.0
      - run: pnpm test:agent-daemon:real

  deploy-cloudflare-platform:
    name: Deploy Platform (${{ matrix.environment }})
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate-worker-config.result == 'success' &&
      github.repository == 'moxt-ai/mobius' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    needs: [validate, validate-worker-config]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            domain: mobius.moxt.ws
          - environment: production
            domain: mobius.moxt.ai
    environment:
      name: ${{ matrix.environment }}
      url: https://${{ matrix.domain }}
    concurrency:
      group: deploy-mobius-platform-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Deploy Mobius Platform
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          MOBIUS_PLATFORM_ALLOWED_ORIGINS: ${{ vars.MOBIUS_PLATFORM_ALLOWED_ORIGINS }}
          MOBIUS_PLATFORM_OIDC_PROVIDERS: ${{ vars.MOBIUS_PLATFORM_OIDC_PROVIDERS }}
          MOBIUS_PLATFORM_OPERATOR_SUBJECTS: ${{ vars.MOBIUS_PLATFORM_OPERATOR_SUBJECTS }}
          SESSION_ACTIVE_SESSIONS_PER_PROJECT: ${{ vars.SESSION_ACTIVE_SESSIONS_PER_PROJECT }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}
        shell: bash
        run: |
          node scripts/validate-worker-config.ts
          umask 077
          secrets_file="$(mktemp "$RUNNER_TEMP/worker-secrets.XXXXXX.json")"
          trap 'rm -f "$secrets_file"' EXIT
          node scripts/validate-worker-config.ts secrets > "$secrets_file"
          worker_vars="$(node scripts/validate-worker-config.ts vars)"
          args=()
          while IFS= read -r -d '' binding; do
            args+=(--var "$binding")
          done < <(printf '%s' "$worker_vars" | jq -j 'to_entries[] | .key + ":" + .value + "\u0000"')
          pnpm --dir packages/relay-cloudflare-platform exec wrangler deploy \
            --config wrangler.jsonc \
            --env "$DEPLOY_ENVIRONMENT" \
            --secrets-file "$secrets_file" \
            "${args[@]}" \
            --message "GitHub ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
      - name: Verify Platform health
        env:
          PLATFORM_ORIGIN: https://${{ matrix.domain }}
        shell: bash
        run: |
          expected='{"service":"mobius-relay-platform","status":"ok"}'
          actual=''
          for attempt in {1..6}; do
            if actual="$(curl \
              --fail \
              --show-error \
              --silent \
              --connect-timeout 5 \
              --max-time 15 \
              "$PLATFORM_ORIGIN/mobius/api/dashboard/health")" && \
              [[ "$actual" == "$expected" ]]; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done
          echo "Unexpected Platform health response after deployment propagation: $actual" >&2
          exit 1
