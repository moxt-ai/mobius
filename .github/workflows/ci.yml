name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-worker-config:
    name: Validate Worker config (${{ matrix.environment }})
    if: >-
      github.repository == 'moxt-ai/mobius' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Validate GitHub runtime configuration
        run: node scripts/validate-worker-config.ts
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          MOBIUS_PLATFORM_ALLOWED_ORIGINS: ${{ vars.MOBIUS_PLATFORM_ALLOWED_ORIGINS }}
          MOBIUS_PLATFORM_OIDC_PROVIDERS: ${{ vars.MOBIUS_PLATFORM_OIDC_PROVIDERS }}
          MOBIUS_PLATFORM_OPERATOR_SUBJECTS: ${{ vars.MOBIUS_PLATFORM_OPERATOR_SUBJECTS }}
          SESSION_ACTIVE_SESSIONS_PER_PROJECT: ${{ vars.SESSION_ACTIVE_SESSIONS_PER_PROJECT }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @moxt-ai/mobius build
      - run: pnpm test
      - name: Verify Web Runtime administration
        run: pnpm --filter @moxt-ai/mobius-web test:integration
      - name: Install real Agents and production adapters
        run: >-
          npm install --global
          @openai/codex@0.154.0
          @anthropic-ai/claude-code@2.1.273
          @agentclientprotocol/claude-agent-acp@0.73.0
          opencode-ai@1.18.29
          @earendil-works/pi-coding-agent@1.1.0
          pi-acp@0.0.34
      - run: pnpm test:agent-daemon:real

  deploy-cloudflare-platform:
    name: Deploy Platform (${{ matrix.environment }})
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.validate-worker-config.result == 'success' &&
      needs.deploy-cloudflare-recording.result == 'success' &&
      github.repository == 'moxt-ai/mobius' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [validate, validate-worker-config, deploy-cloudflare-recording]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            domain: mobius.moxt.ws
            database: mobius-platform-staging-control-plane-wnam
            recording-provider: recording-staging
          - environment: production
            domain: mobius.moxt.ai
            database: mobius-platform-production-control-plane-wnam
            recording-provider: recording-production
    environment:
      name: ${{ matrix.environment }}
      url: https://${{ matrix.domain }}
    concurrency:
      group: deploy-mobius-platform-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply Platform D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}
          D1_DATABASE: ${{ matrix.database }}
        run: >-
          pnpm --dir packages/relay-cloudflare-platform exec wrangler d1 migrations apply
          "$D1_DATABASE"
          --remote
          --config wrangler.jsonc
          --env "$DEPLOY_ENVIRONMENT"
      - name: Deploy Mobius Platform
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          MOBIUS_PLATFORM_ALLOWED_ORIGINS: ${{ vars.MOBIUS_PLATFORM_ALLOWED_ORIGINS }}
          MOBIUS_PLATFORM_OIDC_PROVIDERS: ${{ vars.MOBIUS_PLATFORM_OIDC_PROVIDERS }}
          MOBIUS_PLATFORM_OPERATOR_SUBJECTS: ${{ vars.MOBIUS_PLATFORM_OPERATOR_SUBJECTS }}
          SESSION_ACTIVE_SESSIONS_PER_PROJECT: ${{ vars.SESSION_ACTIVE_SESSIONS_PER_PROJECT }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}
          RECORDING_PROVIDER_ID: ${{ matrix.recording-provider }}
        shell: bash
        run: |
          node scripts/validate-worker-config.ts
          pnpm --filter @moxt-ai/mobius-platform-app build --mode "$DEPLOY_ENVIRONMENT"
          umask 077
          secrets_file="$(mktemp "$RUNNER_TEMP/worker-secrets.XXXXXX.json")"
          trap 'rm -f "$secrets_file"' EXIT
          node scripts/validate-worker-config.ts secrets > "$secrets_file"
          worker_vars="$(node scripts/validate-worker-config.ts vars)"
          args=()
          while IFS= read -r -d '' binding; do
            args+=(--var "$binding")
          done < <(printf '%s' "$worker_vars" | jq -j 'to_entries[] | .key + ":" + .value + "\u0000"')
          pnpm --dir packages/relay-cloudflare-platform exec wrangler deploy \
            --config wrangler.jsonc \
            --env "$DEPLOY_ENVIRONMENT" \
            --var RECORDING_PROVIDER_ID:"$RECORDING_PROVIDER_ID" \
            --secrets-file "$secrets_file" \
            "${args[@]}" \
            --message "GitHub ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
      - name: Verify Platform health
        env:
          PLATFORM_ORIGIN: https://${{ matrix.domain }}
        shell: bash
        run: |
          expected='{"service":"mobius-relay-platform","status":"ok"}'
          actual=''
          for attempt in {1..6}; do
            if actual="$(curl \
              --fail \
              --show-error \
              --silent \
              --connect-timeout 5 \
              --max-time 15 \
              "$PLATFORM_ORIGIN/mobius/api/dashboard/health")" && \
              [[ "$actual" == "$expected" ]]; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done
          echo "Unexpected Platform health response after deployment propagation: $actual" >&2
          exit 1
      - name: Verify Platform page
        env:
          PLATFORM_ORIGIN: https://${{ matrix.domain }}
        shell: bash
        run: |
          for attempt in {1..6}; do
            if curl \
              --fail \
              --show-error \
              --silent \
              --connect-timeout 5 \
              --max-time 15 \
              "$PLATFORM_ORIGIN/" | grep -Fq '<title>Mobius Platform</title>'; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done
          echo "The Platform page was unavailable after deployment propagation" >&2
          exit 1

  deploy-cloudflare-recording:
    name: Deploy Recording (${{ matrix.environment }})
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      github.repository == 'moxt-ai/mobius' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, production]
    environment: ${{ matrix.environment }}
    concurrency:
      group: deploy-mobius-recording-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Deploy Mobius Recording
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_ENVIRONMENT: ${{ matrix.environment }}
        run: >-
          pnpm --dir packages/recording-cloudflare exec wrangler deploy
          --config wrangler.jsonc
          --env "$DEPLOY_ENVIRONMENT"
          --message "GitHub ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

  deploy-cloudflare-standalone:
    name: Deploy Standalone (production)
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      github.repository == 'moxt-ai/mobius' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [validate, deploy-cloudflare-recording]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://mobius-standalone.moxt.ai
    concurrency:
      group: deploy-mobius-standalone-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply Standalone D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: >-
          pnpm --dir packages/relay-cloudflare-standalone exec wrangler d1 migrations apply
          mobius-standalone-production-directory-wnam
          --remote
          --config wrangler.jsonc
          --env production
      - name: Deploy Mobius Standalone
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MOBIUS_STANDALONE_TOKEN: ${{ secrets.MOBIUS_STANDALONE_TOKEN }}
        shell: bash
        run: |
          if [[ "${#MOBIUS_STANDALONE_TOKEN}" -lt 32 ]]; then
            echo "MOBIUS_STANDALONE_TOKEN must contain at least 32 characters" >&2
            exit 1
          fi
          pnpm --filter @moxt-ai/mobius-web build
          umask 077
          secrets_file="$(mktemp "$RUNNER_TEMP/worker-secrets.XXXXXX.json")"
          trap 'rm -f "$secrets_file"' EXIT
          jq --null-input \
            --arg token "$MOBIUS_STANDALONE_TOKEN" \
            '{MOBIUS_STANDALONE_TOKEN: $token}' > "$secrets_file"
          pnpm --dir packages/relay-cloudflare-standalone exec wrangler deploy \
            --config wrangler.jsonc \
            --env production \
            --secrets-file "$secrets_file" \
            --message "GitHub ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
      - name: Verify Standalone page
        env:
          STANDALONE_ORIGIN: https://mobius-standalone.moxt.ai
        shell: bash
        run: |
          for attempt in {1..6}; do
            if curl \
              --fail \
              --show-error \
              --silent \
              --connect-timeout 5 \
              --max-time 15 \
              "$STANDALONE_ORIGIN/" | grep -Fq '<title>Mobius Agent Chat</title>'; then
              exit 0
            fi
            if [[ "$attempt" -lt 6 ]]; then
              sleep 5
            fi
          done
          echo "The Standalone page was unavailable after deployment propagation" >&2
          exit 1
