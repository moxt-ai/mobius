name: Publish CLI

on:
  push:
    branches: [main]
    paths:
      - packages/cli/package.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    name: npm
    if: github.repository == 'moxt-ai/mobius'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Detect CLI version change
        id: cli-version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/ci-detect-mobius-cli-version.cjs

      - name: Enable pnpm
        if: steps.cli-version.outputs.changed == 'true'
        run: corepack enable

      - name: Install release dependencies
        if: steps.cli-version.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Publish CLI
        if: steps.cli-version.outputs.changed == 'true'
        run: node scripts/ci-publish-mobius-release.cjs cli
