name: Publish CLI

on:
  push:
    branches: [main]
    paths:
      - packages/cli/package.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  detect:
    name: Detect release
    if: github.repository == 'moxt-ai/mobius'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.cli-version.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Detect CLI version change
        id: cli-version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/ci-detect-mobius-cli-version.cjs

  verify:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    uses: ./.github/workflows/cli-compatibility.yml

  publish:
    name: npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4.3.0
        with:
          name: mobius-cli-release
          path: ${{ runner.temp }}
      - name: Publish verified CLI archive
        run: node scripts/ci-publish-mobius-release.cjs cli
