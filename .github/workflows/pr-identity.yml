name: PR Identity

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: pr-identity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  identity:
    name: identity
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          retries: 2
          script: |
            const {owner, repo} = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const {data: pullRequest} = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });

            const authorLogin = pullRequest.user?.login;
            const allowedAssociations = new Set(["MEMBER", "OWNER"]);

            if (authorLogin === "dependabot[bot]") {
              return;
            }

            if (!allowedAssociations.has(pullRequest.author_association)) {
              core.setFailed(
                "Only moxt-ai organization members may merge pull requests.",
              );
            }
