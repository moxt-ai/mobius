name: Verify action lockfile

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  action-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install GitHub action lockfile verifier
        run: gh extension install github/gh-actions-lock --pin v0.4.0
      - name: Verify locked action identities and workflow coverage
        run: gh actions-lock --verify
