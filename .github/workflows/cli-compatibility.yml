name: npx CLI compatibility

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Pack the release once
        run: pnpm --dir packages/cli pack --out "$RUNNER_TEMP/mobius-cli.tgz"
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: mobius-cli-release
          path: ${{ runner.temp }}/mobius-cli.tgz
          if-no-files-found: error
          retention-days: 7

  installed-release:
    name: npx CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.19.0', '22', '24.0.0', '24']
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4.3.0
        with:
          name: mobius-cli-release
          path: ${{ runner.temp }}/release
      - name: Exercise the exact archive through npx
        shell: bash
        env:
          MOBIUS_RELEASE_ARCHIVE: ${{ runner.temp }}/release/mobius-cli.tgz
          npm_config_cache: ${{ runner.temp }}/npx-cache
          npm_config_engine_strict: 'true'
          # The journeys keep their state in the temporary directory, where the released
          # CLI installs itself and its candidate (about 300 MB each). Windows' default
          # temporary directory is on the slow system drive; keep it beside the npm cache.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: >-
          npx --yes --prefer-online --package "$MOBIUS_RELEASE_ARCHIVE" -- node --test
          packages/cli/tests/release/installed-release.test.mjs
          packages/cli/tests/release/legacy-manager.test.mjs

  unsupported-node:
    name: Unsupported Node diagnostic
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22.13.0'
      - uses: actions/download-artifact@v4.3.0
        with:
          name: mobius-cli-release
          path: ${{ runner.temp }}/release
      - name: Verify actionable startup rejection through npx
        env:
          MOBIUS_RELEASE_ARCHIVE: ${{ runner.temp }}/release/mobius-cli.tgz
          MOBIUS_EXPECT_UNSUPPORTED: 'true'
          npm_config_engine_strict: 'false'
        run: npx --yes --prefer-online --package "$MOBIUS_RELEASE_ARCHIVE" -- node --test packages/cli/tests/release/installed-release.test.mjs
