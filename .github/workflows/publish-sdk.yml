name: Publish SDK
 
on:
  push:
    branches: [main]
    paths:
      - packages/mobius-sdk/package.json
  workflow_dispatch:
 
permissions:
  contents: read
  id-token: write
 
concurrency:
  group: publish-sdk
  cancel-in-progress: false
 
jobs:
  publish:
    name: npm
    if: github.repository == 'moxt-ai/mobius' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
 
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
 
      - name: Detect package version changes
        id: versions
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-detect-mobius-package-versions.cjs
 
      - name: Enable pnpm
        if: steps.versions.outputs.sdk_changed == 'true'
        run: corepack enable
 
      - name: Install release dependencies
        if: steps.versions.outputs.sdk_changed == 'true'
        run: pnpm install --frozen-lockfile
 
      - name: Ensure npm supports OIDC trusted publishing
        if: steps.versions.outputs.sdk_changed == 'true'
        run: npm install --global npm@11.5.1
 
      - name: Check npm publication state
        id: registry
        if: steps.versions.outputs.sdk_changed == 'true'
        env:
          SDK_CHANGED: ${{ steps.versions.outputs.sdk_changed }}
        run: node scripts/ci-check-mobius-publication-state.cjs
 
      - name: Pack release artifacts
        if: steps.versions.outputs.sdk_changed == 'true'
        env:
          SDK_CHANGED: ${{ steps.versions.outputs.sdk_changed }}
          SDK_EXISTS: ${{ steps.registry.outputs.sdk_exists }}
        run: node scripts/ci-pack-mobius-releases.cjs
 
      - name: Publish SDK
        if: steps.versions.outputs.sdk_changed == 'true' && steps.registry.outputs.sdk_exists != 'true'
        run: node scripts/ci-publish-mobius-release.cjs sdk
