name: Publish SDK

on:
  push:
    branches: [main]
    paths:
      - packages/mobius-sdk/package.json

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: npm
    if: github.repository == 'moxt-ai/mobius'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Detect SDK version change
        id: sdk-version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { appendFileSync, readFileSync } from "node:fs";

          const before = process.env.BEFORE_SHA;
          const output = process.env.GITHUB_OUTPUT;
          if (before === undefined || !/^([0-9a-f]{40}|[0-9a-f]{64})$/.test(before) || output === undefined) {
            throw new Error("Required GitHub Actions inputs are unavailable or invalid");
          }
          const manifest = "packages/mobius-sdk/package.json";
          const readVersion = (text) => {
            const value = JSON.parse(text);
            if (value === null || typeof value !== "object" || Array.isArray(value) || typeof value.version !== "string") {
              throw new Error("Package manifest has no string version");
            }
            return value.version;
          };
          const previousPath = execFileSync("git", ["ls-tree", "--name-only", before, manifest], { encoding: "utf8", timeout: 30_000 }).trim();
          // The rename commit still has the SDK at its original path in the previous revision.
          const previousManifest = previousPath === "" ? "packages/web-sdk/package.json" : manifest;
          const previous = readVersion(execFileSync("git", ["show", `${before}:${previousManifest}`], { encoding: "utf8", timeout: 30_000 }));
          const current = readVersion(readFileSync(manifest, "utf8"));
          const changed = previous !== current;
          console.log(changed ? `SDK version changed from ${previous} to ${current}.` : `SDK version remains ${current}; publication will be skipped.`);
          appendFileSync(output, `changed=${changed}\n`);
          NODE

      - name: Enable pnpm
        if: steps.sdk-version.outputs.changed == 'true'
        run: |
          corepack enable
          pnpm --version
          npm --version

      - if: steps.sdk-version.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Pack release artifacts
        if: steps.sdk-version.outputs.changed == 'true'
        run: |
          pnpm --dir packages/protocol pack --out "$RUNNER_TEMP/mobius-protocol.tgz"
          pnpm --dir packages/mobius-sdk pack --out "$RUNNER_TEMP/mobius-sdk.tgz"
          npm publish "$RUNNER_TEMP/mobius-protocol.tgz" --access public --dry-run
          npm publish "$RUNNER_TEMP/mobius-sdk.tgz" --access public --dry-run

      - name: Check protocol dependency on npm
        if: steps.sdk-version.outputs.changed == 'true'
        id: protocol
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("packages/protocol/package.json", "utf8"));
          if (manifest?.name !== "@moxt-ai/mobius-protocol" || typeof manifest.version !== "string") {
            throw new Error("Protocol manifest is invalid");
          }
          const output = process.env.GITHUB_OUTPUT;
          if (output === undefined) throw new Error("GitHub output path is unavailable");
          const response = await fetch(`https://registry.npmjs.org/@moxt-ai%2Fmobius-protocol/${encodeURIComponent(manifest.version)}`, {
            signal: AbortSignal.timeout(30_000),
          });
          await response.body?.cancel();
          if (response.status !== 200 && response.status !== 404) {
            throw new Error(`npm registry returned HTTP ${response.status}`);
          }
          appendFileSync(output, `missing=${response.status === 404}\n`);
          NODE

      - name: Publish protocol dependency
        if: steps.sdk-version.outputs.changed == 'true' && steps.protocol.outputs.missing == 'true'
        run: npm publish "$RUNNER_TEMP/mobius-protocol.tgz" --access public

      - name: Publish SDK
        if: steps.sdk-version.outputs.changed == 'true'
        run: npm publish "$RUNNER_TEMP/mobius-sdk.tgz" --access public
