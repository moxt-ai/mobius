name: Publish Protocol and SDK

on:
  push:
    branches: [main]
    paths:
      - packages/protocol/package.json
      - packages/mobius-sdk/package.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-protocol-and-sdk
  cancel-in-progress: false

jobs:
  publish:
    name: npm
    if: github.repository == 'moxt-ai/mobius' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Detect package version changes
        id: versions
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { appendFileSync, readFileSync } from "node:fs";

          const before = process.env.BEFORE_SHA;
          const eventName = process.env.EVENT_NAME;
          const output = process.env.GITHUB_OUTPUT;
          const manual = eventName === "workflow_dispatch";
          if (output === undefined || eventName === undefined) {
            throw new Error("Required GitHub Actions inputs are unavailable");
          }
          if (!manual && (before === undefined || !/^([0-9a-f]{40}|[0-9a-f]{64})$/.test(before))) {
            throw new Error("The previous commit SHA is invalid");
          }

          const packages = [
            {
              label: "Protocol",
              manifest: "packages/protocol/package.json",
              name: "@moxt-ai/mobius-protocol",
              output: "protocol",
            },
            {
              label: "SDK",
              manifest: "packages/mobius-sdk/package.json",
              legacyManifest: "packages/web-sdk/package.json",
              name: "@moxt-ai/mobius-sdk",
              output: "sdk",
            },
          ];

          const readManifest = (path, expectedName) => {
            const manifest = JSON.parse(readFileSync(path, "utf8"));
            if (
              manifest === null ||
              typeof manifest !== "object" ||
              Array.isArray(manifest) ||
              manifest.name !== expectedName ||
              typeof manifest.version !== "string"
            ) {
              throw new Error(`Package manifest at ${path} is invalid`);
            }
            return manifest.version;
          };

          const readManifestAtCommit = (manifest, expectedName) => {
            const text = execFileSync("git", ["show", `${before}:${manifest}`], {
              encoding: "utf8",
              timeout: 30_000,
            });
            const packageJson = JSON.parse(text);
            if (
              packageJson === null ||
              typeof packageJson !== "object" ||
              Array.isArray(packageJson) ||
              packageJson.name !== expectedName ||
              typeof packageJson.version !== "string"
            ) {
              throw new Error(`Package manifest at ${manifest} is invalid`);
            }
            return packageJson.version;
          };

          for (const packageDefinition of packages) {
            const current = readManifest(packageDefinition.manifest, packageDefinition.name);
            let previous = current;
            if (!manual) {
              try {
                previous = readManifestAtCommit(packageDefinition.manifest, packageDefinition.name);
              } catch (error) {
                if (packageDefinition.legacyManifest === undefined) throw error;
                previous = readManifestAtCommit(packageDefinition.legacyManifest, packageDefinition.name);
              }
            }
            const changed = manual || previous !== current;
            console.log(
              manual
                ? `${packageDefinition.label} manual release selected at ${current}.`
                : changed
                  ? `${packageDefinition.label} version changed from ${previous} to ${current}.`
                  : `${packageDefinition.label} version remains ${current}; publication will be skipped.`,
            );
            appendFileSync(output, `${packageDefinition.output}_changed=${String(changed)}\n`);
          }
          NODE

      - name: Enable pnpm
        if: steps.versions.outputs.protocol_changed == 'true' || steps.versions.outputs.sdk_changed == 'true'
        run: |
          corepack enable
          pnpm --version

      - name: Install release dependencies
        if: steps.versions.outputs.protocol_changed == 'true' || steps.versions.outputs.sdk_changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Ensure npm supports OIDC trusted publishing
        if: steps.versions.outputs.protocol_changed == 'true' || steps.versions.outputs.sdk_changed == 'true'
        run: |
          npm install --global npm@11.5.1
          npm --version

      - name: Pack release artifacts
        if: steps.versions.outputs.protocol_changed == 'true' || steps.versions.outputs.sdk_changed == 'true'
        env:
          PROTOCOL_CHANGED: ${{ steps.versions.outputs.protocol_changed }}
          SDK_CHANGED: ${{ steps.versions.outputs.sdk_changed }}
        run: |
          set -euo pipefail
          if [ "$PROTOCOL_CHANGED" = "true" ]; then
            pnpm --dir packages/protocol pack --out "$RUNNER_TEMP/mobius-protocol.tgz"
            npm publish "$RUNNER_TEMP/mobius-protocol.tgz" --access public --dry-run
          fi
          if [ "$SDK_CHANGED" = "true" ]; then
            pnpm --dir packages/mobius-sdk pack --out "$RUNNER_TEMP/mobius-sdk.tgz"
            npm publish "$RUNNER_TEMP/mobius-sdk.tgz" --access public --dry-run
          fi

      - name: Check npm publication state
        id: registry
        if: steps.versions.outputs.protocol_changed == 'true' || steps.versions.outputs.sdk_changed == 'true'
        env:
          PROTOCOL_CHANGED: ${{ steps.versions.outputs.protocol_changed }}
          SDK_CHANGED: ${{ steps.versions.outputs.sdk_changed }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";

          const output = process.env.GITHUB_OUTPUT;
          const protocolChanged = process.env.PROTOCOL_CHANGED === "true";
          const sdkChanged = process.env.SDK_CHANGED === "true";
          if (output === undefined) {
            throw new Error("GitHub output path is unavailable");
          }

          const packages = [
            {
              output: "protocol_exists",
              required: protocolChanged || sdkChanged,
              manifest: "packages/protocol/package.json",
              name: "@moxt-ai/mobius-protocol",
            },
            {
              output: "sdk_exists",
              required: sdkChanged,
              manifest: "packages/mobius-sdk/package.json",
              name: "@moxt-ai/mobius-sdk",
            },
          ];

          for (const packageDefinition of packages) {
            if (!packageDefinition.required) continue;
            const manifest = JSON.parse(readFileSync(packageDefinition.manifest, "utf8"));
            if (
              manifest === null ||
              typeof manifest !== "object" ||
              Array.isArray(manifest) ||
              manifest.name !== packageDefinition.name ||
              typeof manifest.version !== "string"
            ) {
              throw new Error(`Package manifest at ${packageDefinition.manifest} is invalid`);
            }
            const response = await fetch(
              `https://registry.npmjs.org/${encodeURIComponent(packageDefinition.name)}/${encodeURIComponent(manifest.version)}`,
              { signal: AbortSignal.timeout(30_000) },
            );
            await response.body?.cancel();
            if (response.status !== 200 && response.status !== 404) {
              throw new Error(`npm registry returned HTTP ${response.status} for ${packageDefinition.name}@${manifest.version}`);
            }
            const exists = response.status === 200;
            console.log(`${packageDefinition.name}@${manifest.version} is ${exists ? "already published" : "not yet published"}.`);
            appendFileSync(output, `${packageDefinition.output}=${String(exists)}\n`);
          }
          NODE

      - name: Require the SDK Protocol dependency
        if: steps.versions.outputs.sdk_changed == 'true' && steps.versions.outputs.protocol_changed != 'true' && steps.registry.outputs.protocol_exists != 'true'
        run: |
          echo "::error title=Missing Protocol release::The SDK requires the current @moxt-ai/mobius-protocol version, but it is not published. Bump the Protocol version in this release or publish it first."
          exit 1

      - name: Publish Protocol
        if: steps.versions.outputs.protocol_changed == 'true' && steps.registry.outputs.protocol_exists != 'true'
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            rm -f "$NPM_CONFIG_USERCONFIG"
          fi
          npm publish "$RUNNER_TEMP/mobius-protocol.tgz" --access public

      - name: Wait for Protocol registry availability
        if: steps.versions.outputs.sdk_changed == 'true' && steps.versions.outputs.protocol_changed == 'true' && steps.registry.outputs.protocol_exists != 'true'
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const manifestPath = "packages/protocol/package.json";
          const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));
          if (
            manifest === null ||
            typeof manifest !== "object" ||
            Array.isArray(manifest) ||
            manifest.name !== "@moxt-ai/mobius-protocol" ||
            typeof manifest.version !== "string"
          ) {
            throw new Error(`Package manifest at ${manifestPath} is invalid`);
          }

          const registryUrl = `https://registry.npmjs.org/${encodeURIComponent(manifest.name)}/${encodeURIComponent(manifest.version)}`;
          const deadline = Date.now() + 5 * 60_000;
          let available = false;
          let lastResult = "no response";

          while (!available && Date.now() < deadline) {
            try {
              const response = await fetch(registryUrl, {
                signal: AbortSignal.timeout(Math.max(1, Math.min(30_000, deadline - Date.now()))),
              });
              await response.body?.cancel();
              lastResult = `HTTP ${response.status}`;
              if (response.status === 200) {
                available = true;
                console.log(`${manifest.name}@${manifest.version} is available in npm.`);
                continue;
              }
            } catch (error) {
              lastResult = error instanceof Error ? error.message : "request failed";
            }

            const remaining = deadline - Date.now();
            if (remaining > 0) {
              console.log(`Waiting for ${manifest.name}@${manifest.version} to become available in npm (${lastResult}).`);
              await new Promise((resolve) => setTimeout(resolve, Math.min(5_000, remaining)));
            }
          }

          if (!available) {
            throw new Error(`${manifest.name}@${manifest.version} did not become available in npm within 5 minutes (last result: ${lastResult}).`);
          }
          NODE

      - name: Publish SDK
        if: steps.versions.outputs.sdk_changed == 'true' && steps.registry.outputs.sdk_exists != 'true'
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            rm -f "$NPM_CONFIG_USERCONFIG"
          fi
          npm publish "$RUNNER_TEMP/mobius-sdk.tgz" --access public
