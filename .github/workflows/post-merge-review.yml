name: Moxt PR Review

run-name: 'Moxt review for PR #${{ github.event.pull_request.number || inputs.pr_number }}'

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open pull request number to review
        required: true
        type: string

# Only trusted base-branch workflow code runs; no PR code is checked out.
permissions:
  pull-requests: read

concurrency:
  group: moxt-pr-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  trigger-review:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request Moxt review
        env:
          WEBHOOK_URL: ${{ vars.MOXT_REVIEW_WEBHOOK_URL || 'https://webhook.moxt.ai/web/api/external/webhooks/integrations/trigger/6zrnmb90/a6a7f99b-4195-4ab5-b9c7-54bff8adcc28' }}
          WEBHOOK_TOKEN: ${{ secrets.MOXT_REVIEW_WEBHOOK_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REVIEW_ACTION: ${{ github.event.action || 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$WEBHOOK_TOKEN" ]]; then
            echo '::error::Configure MOXT_REVIEW_WEBHOOK_TOKEN as an Actions secret.'
            exit 1
          fi
          case "$WEBHOOK_URL" in
            https://webhook.moxt.ai/web/api/external/webhooks/integrations/trigger/*) ;;
            *)
              echo '::error::MOXT_REVIEW_WEBHOOK_URL must be a production Moxt integration webhook URL.'
              exit 1
              ;;
          esac

          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Expected a positive pull request number.'
            exit 1
          fi

          # Fetch current metadata with a read-only token. Never check out or run PR code.
          pull_request="$RUNNER_TEMP/moxt-pull-request.json"
          curl --silent --show-error --fail \
            --proto '=https' --connect-timeout 10 --max-time 30 \
            --header "authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output "$pull_request" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER"

          if ! jq -e '.state == "open"' "$pull_request" > /dev/null; then
            echo 'Pull request is no longer open; skipping review.'
            exit 0
          fi

          payload="$RUNNER_TEMP/moxt-pr-review.json"
          jq --arg action "$REVIEW_ACTION" --arg repository "$REPOSITORY" '{
            action: $action,
            number: .number,
            repository: $repository,
            pull_request: {
              title: .title,
              url: .html_url,
              head_sha: .head.sha,
              base_sha: .base.sha,
              author: .user.login,
              draft: .draft
            }
          }' "$pull_request" > "$payload"

          # Delivery can start an asynchronous pipeline; do not retry and duplicate it.
          status=$(curl \
            --silent --show-error --fail-with-body \
            --proto '=https' --connect-timeout 10 --max-time 30 \
            --request POST \
            --header 'Content-Type: application/json' \
            --header "authorization: $WEBHOOK_TOKEN" \
            --data-binary "@$payload" \
            --output "$RUNNER_TEMP/moxt-pr-review-response" \
            --write-out '%{http_code}' \
            "$WEBHOOK_URL")

          if [[ "$status" != '202' ]]; then
            echo "::error::Expected Moxt HTTP 202 Accepted, received HTTP $status."
            exit 1
          fi

          echo 'Moxt accepted the pull request review request.'
          {
            echo '### Moxt review requested'
            echo
            jq -r '"PR: \(.html_url)\n\nRequested head: \(.head.sha)\n\nBase: \(.base.sha)\n"' "$pull_request"
            echo 'Moxt accepted the webhook (HTTP 202). This confirms delivery, not review completion.'
            echo 'The reviewer agent publishes the result back to the pull request asynchronously.'
            echo 'Each new head commit receives a comment; repeated delivery of the same head is deduplicated by the reviewer.'
          } >> "$GITHUB_STEP_SUMMARY"
